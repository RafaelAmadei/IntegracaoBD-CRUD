<section class="formulario-cliente">

  <div class="cabecalho-form">
    <a routerLink="/clientes" class="voltar">← Voltar para clientes</a>

    <h2>Novo cliente</h2>
    <p>Preencha os dados para cadastrar um cliente.</p>
  </div>

  <div *ngIf="mensagemSucesso" class="mensagem-sucesso" role="status">
    {{ mensagemSucesso }}
  </div>

  <div *ngIf="mensagemErro" class="mensagem-erro" role="alert">
    {{ mensagemErro }}
  </div>

  <form (ngSubmit)="cadastrar()">

    <div class="campo">
      <label for="nome">Nome completo</label>
      <input
        type="text"
        id="nome"
        name="nome"
        [(ngModel)]="nome"
        required
        placeholder="Digite o nome completo">
    </div>

    <div class="campo">
      <label for="telefone">Telefone</label>
      <input
        type="tel"
        id="telefone"
        name="telefone"
        [(ngModel)]="telefone"
        required
        placeholder="(00) 00000-0000">
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        required
        placeholder="exemplo@email.com">
    </div>

    <button type="submit">Cadastrar cliente</button>

  </form>

</section>
